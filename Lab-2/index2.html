<!-- WAP to recognize which mouse event is fired. -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program-2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
 </head>
 <body>
    <div class="p-5">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold p-5 rounded" onmousedown="mouseEvent('Mouse Down')" onmouseup="mouseEvent('Mouse Up')" onmouseover="mouseEvent('Mouse Over')" onmouseout="mouseEvent('Mouse Out')" onmousemove="mouseEvent('Mouse Move')">Hover or Click Me!</button>
    </div>
    <script>
        function mouseEvent(eventType) {
            console.log(eventType + " event fired");
        }
    </script>
 </body>
 </html>
