<!-- WAP to recognize which keyboard event is fired. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Program-3</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="p-5">
      <input
        type="text"
        class="border-2 border-gray-300 p-3 rounded border"
        onkeydown="keyboardEvent('Key Down')"
        onkeyup="keyboardEvent('Key Up')"
        onkeypress="keyboardEvent('Key Press')"
        placeholder="Type something..."
      />
    </div>
    <script>
      function keyboardEvent(eventType) {
        console.log(eventType + " event fired");
      }
    </script>
  </body>
</html>
